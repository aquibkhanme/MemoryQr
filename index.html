<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memory QR</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    color:white;
    min-height:100vh;

    background:
    radial-gradient(circle at top,#303d78 0%,#10152f 40%,#050713 100%);
}

.container{
    width:92%;
    max-width:850px;
    margin:auto;
    padding:25px 0 30px;
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    letter-spacing:2px;
}

.logo span{
    color:#ff5b9d;
}

.hero{
    text-align:center;
    padding:25px 5px;
}

.hero h1{
    font-size:42px;
    margin:10px 0;
}

.hero p{
    color:#c8cee3;
    line-height:1.6;
}

.card{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    border-radius:25px;
    padding:25px;

    box-shadow:
    0 20px 50px rgba(0,0,0,.35);

    backdrop-filter:blur(12px);
}

h2{
    text-align:center;
    margin-top:0;
}

.options{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
    margin-top:20px;
}

.option{
    display:flex;
    align-items:center;
    justify-content:center;

    min-height:65px;

    border-radius:17px;

    background:
    linear-gradient(135deg,#6757e8,#a45de8);

    color:white;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.option:active{
    transform:scale(.97);
}

input[type="file"]{
    display:none;
}

#fileStatus{
    text-align:center;
    margin-top:18px;
    color:#c6cce2;
    font-size:14px;
    line-height:1.7;
}

.diary{
    margin-top:22px;
}

textarea{
    width:100%;
    min-height:140px;

    border:1px solid rgba(255,255,255,.15);
    border-radius:17px;

    padding:16px;

    background:rgba(0,0,0,.25);
    color:white;

    outline:none;
    resize:vertical;

    font-size:15px;
}

textarea::placeholder{
    color:#aab2ca;
}

.generate{
    width:100%;

    border:0;
    border-radius:17px;

    padding:17px;
    margin-top:15px;

    background:
    linear-gradient(135deg,#ff4f81,#ff795d);

    color:white;

    font-size:17px;
    font-weight:bold;

    cursor:pointer;
}

.generate:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#status{
    text-align:center;
    margin-top:18px;
    color:#c7d0ff;
    line-height:1.6;
}

#qrBox{
    display:none;

    text-align:center;

    margin-top:28px;
    padding:25px;

    border-radius:22px;

    background:rgba(0,0,0,.25);
    border:1px solid rgba(255,255,255,.1);
}

#qrImage{
    width:240px;
    max-width:100%;

    padding:10px;

    background:white;

    border-radius:15px;
}

#memoryId{
    color:#bfc6dd;
    word-break:break-all;
}

.openMemory{
    display:inline-block;

    margin-top:12px;

    padding:14px 22px;

    border-radius:13px;

    background:#25D366;

    color:white;

    text-decoration:none;

    font-weight:bold;
}

footer{
    text-align:center;

    color:#858da7;

    padding:30px 0 5px;

    font-size:14px;
}

@media(max-width:600px){

    .hero h1{
        font-size:32px;
    }

    .options{
        grid-template-columns:1fr;
    }

}

</style>
</head>


<body>

<div class="container">

<div class="logo">
♥ MEMORY <span>QR</span>
</div>


<div class="hero">

<h1>Your Memories, Forever.</h1>

<p>
Save photos, camera moments, videos and your personal diary
inside one Memory QR.
</p>

</div>


<div class="card">

<h2>📦 Create Your Memory</h2>


<div class="options">


<label class="option">

📷 Camera

<input
id="cameraInput"
type="file"
accept="image/*"
capture="environment">

</label>


<label class="option">

🖼️ Gallery

<input
id="galleryInput"
type="file"
accept="image/*"
multiple>

</label>


<label class="option">

🎥 Video

<input
id="videoInput"
type="file"
accept="video/*"
multiple>

</label>


<label class="option" onclick="openDiary()">

📔 Personal Diary

</label>


</div>


<div id="fileStatus">
No photo or video added yet.
</div>


<div class="diary">

<textarea
id="message"
placeholder="Write your personal diary or special message here..."></textarea>


<button
id="generateButton"
class="generate"
onclick="generateMemoryQR()">

✨ Generate Memory QR

</button>

</div>


<div id="status"></div>


<div id="qrBox">

<h2>🎉 Memory QR Ready</h2>

<img
id="qrImage"
alt="Memory QR">


<p id="memoryId"></p>


<a
id="openMemory"
class="openMemory"
target="_blank">

❤️ Open My Memory

</a>

</div>


</div>


<footer>

This site is made by Aquib Khan ❤️

</footer>

</div>


<script>

let memoryId = null;
let memoryData = null;

let uploadedPhotos = 0;
let uploadedVideos = 0;

let diarySaved = false;


/* --------------------------------
   CREATE MEMORY ID
-------------------------------- */

async function createMemory(){

    if(memoryId){
        return true;
    }

    try{

        const response = await fetch(
            "/create-memory",
            {
                method:"POST"
            }
        );

        if(!response.ok){
            throw new Error(
                "Memory creation failed"
            );
        }

        memoryData =
            await response.json();

        memoryId =
            memoryData.memory_id;

        return true;

    }catch(error){

        document.getElementById(
            "status"
        ).innerText =
            "Memory could not be created. Please try again.";

        return false;
    }
}


/* --------------------------------
   UPLOAD FILE
-------------------------------- */

async function uploadFile(file){

    const ready =
        await createMemory();

    if(!ready){
        return false;
    }

    const formData =
        new FormData();

    /*
       IMPORTANT:
       app.py reads "file"
    */

    formData.append(
        "file",
        file
    );

    formData.append(
        "memory_id",
        memoryId
    );


    try{

        const response =
            await fetch(
                "/upload",
                {
                    method:"POST",
                    body:formData
                }
            );


        if(!response.ok){

            throw new Error(
                "Upload failed"
            );

        }


        const result =
            await response.json();


        if(
            !result.success ||
            !result.files ||
            result.files.length === 0
        ){

            throw new Error(
                "File was not saved"
            );

        }


        if(
            file.type.startsWith(
                "image/"
            )
        ){

            uploadedPhotos++;

        }


        if(
            file.type.startsWith(
                "video/"
            )
        ){

            uploadedVideos++;

        }


        updateFileStatus();

        return true;


    }catch(error){

        document.getElementById(
            "status"
        ).innerText =
            "Could not save: " +
            file.name;

        return false;
    }
}


/* --------------------------------
   UPLOAD MULTIPLE FILES
-------------------------------- */

async function uploadFiles(files){

    if(!files || files.length===0){
        return;
    }


    document.getElementById(
        "status"
    ).innerText =
        "Saving your files...";


    for(
        const file of files
    ){

        await uploadFile(file);

    }


    document.getElementById(
        "status"
    ).innerText =
        "All selected files are saved ❤️";

}


/* --------------------------------
   CAMERA
-------------------------------- */

document.getElementById(
    "cameraInput"
).addEventListener(
    "change",
    async function(){

        if(this.files.length){

            await uploadFiles(
                Array.from(
                    this.files
                )
            );

        }

        this.value = "";

    }
);


/* --------------------------------
   GALLERY
-------------------------------- */

document.getElementById(
    "galleryInput"
).addEventListener(
    "change",
    async function(){

        if(this.files.length){

            await uploadFiles(
                Array.from(
                    this.files
                )
            );

        }

        this.value = "";

    }
);


/* --------------------------------
   VIDEO
-------------------------------- */

document.getElementById(
    "videoInput"
).addEventListener(
    "change",
    async function(){

        if(this.files.length){

            await uploadFiles(
                Array.from(
                    this.files
                )
            );

        }

        this.value = "";

    }
);


/* --------------------------------
   FILE STATUS
-------------------------------- */

function updateFileStatus(){

    let text = "";

    if(
        uploadedPhotos === 0 &&
        uploadedVideos === 0
    ){

        text =
            "No photo or video added yet.";

    }else{

        text =
            "📸 " +
            uploadedPhotos +
            " photo(s) saved";

        text +=
            " • 🎥 " +
            uploadedVideos +
            " video(s) saved";

    }

    document.getElementById(
        "fileStatus"
    ).innerText = text;
}


/* --------------------------------
   DIARY
-------------------------------- */

function openDiary(){

    const diary =
        document.getElementById(
            "message"
        );

    diary.focus();

    diary.scrollIntoView({
        behavior:"smooth",
        block:"center"
    });

}


/* --------------------------------
   SAVE DIARY
-------------------------------- */

async function saveDiary(){

    const message =
        document.getElementById(
            "message"
        ).value.trim();


    if(!message){
        return true;
    }


    if(diarySaved){
        return true;
    }


    const ready =
        await createMemory();

    if(!ready){
        return false;
    }


    try{

        const response =
            await fetch(
                "/save-message",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({

                        memory_id:
                        memoryId,

                        message:
                        message

                    })
                }
            );


        if(!response.ok){

            throw new Error(
                "Diary save failed"
            );

        }


        diarySaved = true;

        return true;


    }catch(error){

        document.getElementById(
            "status"
        ).innerText =
            "Diary could not be saved.";

        return false;
    }
}


/* --------------------------------
   GENERATE QR
-------------------------------- */

async function generateMemoryQR(){

    const button =
        document.getElementById(
            "generateButton"
        );

    const status =
        document.getElementById(
            "status"
        );


    button.disabled = true;


    status.innerText =
        "Saving everything...";


    /*
       Make sure memory exists
    */

    const ready =
        await createMemory();

    if(!ready){

        button.disabled = false;

        return;
    }


    /*
       Save diary
    */

    const diaryOK =
        await saveDiary();

    if(!diaryOK){

        button.disabled = false;

        return;
    }


    /*
       QR is generated only
       after files + diary are saved
    */

    status.innerText =
        "Generating your Memory QR...";


    try{

        document.getElementById(
            "qrImage"
        ).src =
            memoryData.qr +
            "?t=" +
            Date.now();


        document.getElementById(
            "memoryId"
        ).innerText =
            "Memory ID: " +
            memoryId;


        document.getElementById(
            "openMemory"
        ).href =
            memoryData.memory_url;


        document.getElementById(
            "qrBox"
        ).style.display =
            "block";


        status.innerText =
            "Everything saved successfully ❤️";


        document.getElementById(
            "qrBox"
        ).scrollIntoView({
            behavior:"smooth"
        });


    }catch(error){

        status.innerText =
            "QR could not be displayed.";

    }


    button.disabled = false;

}

</script>

</body>
</html>
