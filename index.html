<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memory QR</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    color:white;
    min-height:100vh;
    background:
        radial-gradient(circle at top,#35145f 0%,transparent 40%),
        linear-gradient(135deg,#070914,#120b25,#061b25);
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:25px 18px 40px;
}

.header{
    text-align:center;
    padding:30px 10px;
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:#ff6ac7;
    letter-spacing:2px;
}

h1{
    font-size:42px;
    margin:15px 0 8px;
    background:linear-gradient(90deg,#ff73ca,#8c7bff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.subtitle{
    color:#aaa;
    font-size:15px;
}

.card{
    background:#ffffff0d;
    border:1px solid #ffffff1c;
    border-radius:28px;
    padding:25px;
    margin-top:20px;
    backdrop-filter:blur(15px);
}

.card h2{
    margin-top:0;
    color:#ff82d2;
}

.upload-box{
    display:grid;
    gap:14px;
}

.upload-label{
    display:block;
    padding:18px;
    text-align:center;
    border-radius:18px;
    background:linear-gradient(135deg,#6e2c8f,#40327c);
    cursor:pointer;
    font-weight:bold;
    border:1px solid #ffffff20;
}

.upload-label:active{
    transform:scale(.98);
}

input[type="file"]{
    display:none;
}

.file-info{
    color:#aaa;
    font-size:14px;
    text-align:center;
    word-break:break-word;
}

textarea{
    width:100%;
    min-height:300px;
    resize:vertical;
    padding:20px;
    border-radius:20px;
    border:1px solid #ffffff20;
    outline:none;
    background:#090b18;
    color:white;
    font-family:Arial,sans-serif;
    font-size:16px;
    line-height:1.7;
}

textarea::placeholder{
    color:#777;
}

.counter{
    margin-top:8px;
    text-align:right;
    color:#999;
    font-size:13px;
}

button{
    width:100%;
    padding:17px;
    margin-top:15px;
    border:0;
    border-radius:18px;
    cursor:pointer;
    color:white;
    font-size:16px;
    font-weight:bold;
    background:linear-gradient(90deg,#ff4fb8,#755cff);
}

button:active{
    transform:scale(.98);
}

.status{
    text-align:center;
    margin-top:15px;
    color:#9df5bd;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.qr-box{
    display:none;
    text-align:center;
    margin-top:25px;
}

.qr-box img{
    width:220px;
    max-width:100%;
    border-radius:20px;
    background:white;
    padding:10px;
}

.memory-link{
    margin-top:15px;
    padding:15px;
    border-radius:15px;
    background:#ffffff0d;
    color:#bbb;
    word-break:break-all;
}

.footer{
    text-align:center;
    color:#777;
    margin-top:35px;
    font-size:14px;
}

</style>
</head>

<body>

<div class="container">

<div class="header">

<div class="logo">
♥ MEMORY QR
</div>

<h1>
Your Memories, Forever.
</h1>

<div class="subtitle">
Create a beautiful private memory with photos, videos and your personal diary.
</div>

</div>


<!-- PHOTOS -->

<div class="card">

<h2>📸 Photos</h2>

<div class="upload-box">

<label class="upload-label">
Select Photos
<input
    id="photoInput"
    type="file"
    accept="image/*"
    multiple
    onchange="showFiles('photoInput','photoInfo')">
</label>

<div
    id="photoInfo"
    class="file-info">
No photos selected
</div>

</div>

</div>


<!-- VIDEOS -->

<div class="card">

<h2>🎥 Videos</h2>

<div class="upload-box">

<label class="upload-label">
Select Videos
<input
    id="videoInput"
    type="file"
    accept="video/*"
    multiple
    onchange="showFiles('videoInput','videoInfo')">
</label>

<div
    id="videoInfo"
    class="file-info">
No videos selected
</div>

</div>

</div>


<!-- DIARY -->

<div class="card">

<h2>💌 Personal Diary</h2>

<textarea
    id="diary"
    maxlength="70000"
    placeholder="Write your memories, story, message or diary here...

You can write multiple paragraphs.

Line breaks will remain exactly like you type them.

You can write up to 10,000 words depending on the text."></textarea>

<div
    id="counter"
    class="counter">
0 characters
</div>

<button
    type="button"
    onclick="saveDiary()">
💌 Save Personal Diary
</button>

</div>


<!-- CREATE QR -->

<div class="card">

<h2>✨ Create Memory QR</h2>

<button
    type="button"
    onclick="createMemory()">
Create My Memory
</button>

<div
    id="status"
    class="status">
</div>

<div
    id="qrBox"
    class="qr-box">

<h2>
Your Memory QR
</h2>

<img
    id="qrImage"
    src=""
    alt="Memory QR">

<div
    id="memoryLink"
    class="memory-link">
</div>

<button
    type="button"
    onclick="openMemory()">
❤️ Open My Memory
</button>

</div>

</div>


<div class="footer">
This site is made by Aquib Khan ❤️
</div>

</div>


<script>

/*
   Current Memory ID.
   Browser session/local storage me save rahegi.
*/

let memoryId =
    localStorage.getItem("memoryqr_memory_id") || "";


/* File names show karna */

function showFiles(inputId,infoId){

    const input =
        document.getElementById(inputId);

    const info =
        document.getElementById(infoId);

    const files =
        Array.from(input.files);

    if(files.length === 0){

        info.textContent =
            "No files selected";

        return;
    }

    info.textContent =
        files.length +
        " file(s) selected";
}


/* Diary character counter */

const diary =
    document.getElementById("diary");

const counter =
    document.getElementById("counter");

diary.addEventListener(
    "input",
    function(){

        counter.textContent =
            diary.value.length +
            " characters";

    }
);


/*
   Create Memory
*/

async function createMemory(){

    const status =
        document.getElementById("status");

    status.textContent =
        "Creating your memory...";

    try{

        const response =
            await fetch(
                "/create-memory",
                {
                    method:"POST"
                }
            );

        const data =
            await response.json();

        if(!data.success){

            status.textContent =
                data.error ||
                "Could not create memory.";

            return;
        }


        /*
           IMPORTANT:
           Backend se aayi exact ID save hogi.
        */

        memoryId =
            String(data.memory_id);

        localStorage.setItem(
            "memoryqr_memory_id",
            memoryId
        );


        /*
           Photos upload
        */

        const photoInput =
            document.getElementById(
                "photoInput"
            );

        if(photoInput.files.length > 0){

            await uploadFiles(
                photoInput.files,
                memoryId
            );

        }


        /*
           Videos upload
        */

        const videoInput =
            document.getElementById(
                "videoInput"
            );

        if(videoInput.files.length > 0){

            await uploadFiles(
                videoInput.files,
                memoryId
            );

        }


        /*
           Diary save
        */

        const diaryText =
            diary.value;

        if(diaryText.trim().length > 0){

            const diaryResponse =
                await fetch(
                    "/save-message",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({
                            memory_id:
                                memoryId,

                            message:
                                diaryText
                        })
                    }
                );

            const diaryData =
                await diaryResponse.json();

            if(!diaryData.success){

                status.textContent =
                    "Diary save error: " +
                    (
                        diaryData.error ||
                        "Unknown error"
                    );

                return;
            }
        }


        /*
           QR show
        */

        document.getElementById(
            "qrImage"
        ).src =
            data.qr;

        document.getElementById(
            "memoryLink"
        ).textContent =
            data.memory_url;

        document.getElementById(
            "qrBox"
        ).style.display =
            "block";

        status.textContent =
            "✅ Memory created successfully!";


    }catch(error){

        status.textContent =
            "Error: " +
            error.message;

    }

}


/*
   Upload multiple files
*/

async function uploadFiles(
    files,
    id
){

    const formData =
        new FormData();

    formData.append(
        "memory_id",
        id
    );

    for(
        const file of files
    ){

        formData.append(
            "file",
            file
        );

    }

    const response =
        await fetch(
            "/upload",
            {
                method:"POST",
                body:formData
            }
        );

    const data =
        await response.json();

    if(!data.success){

        throw new Error(
            data.error ||
            "Upload failed"
        );
    }

    return data;

}


/*
   Save diary separately
*/

async function saveDiary(){

    const status =
        document.getElementById(
            "status"
        );

    const text =
        diary.value;


    if(!text.trim()){

        status.textContent =
            "Please write something first.";

        return;
    }


    /*
       Agar Memory ID nahi hai,
       pehle automatically memory create hogi.
    */

    if(!memoryId){

        status.textContent =
            "Creating memory...";

        try{

            const response =
                await fetch(
                    "/create-memory",
                    {
                        method:"POST"
                    }
                );

            const data =
                await response.json();

            if(!data.success){

                status.textContent =
                    data.error ||
                    "Memory creation failed.";

                return;
            }

            memoryId =
                String(data.memory_id);

            localStorage.setItem(
                "memoryqr_memory_id",
                memoryId
            );

        }catch(error){

            status.textContent =
                error.message;

            return;
        }

    }


    status.textContent =
        "Saving diary...";


    try{

        const response =
            await fetch(
                "/save-message",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        memory_id:
                            memoryId,

                        message:
                            text

                    })
                }
            );


        const data =
            await response.json();


        if(!data.success){

            status.textContent =
                "❌ " +
                (
                    data.error ||
                    "Diary could not be saved."
                );

            return;
        }


        status.textContent =
            "✅ Diary saved successfully.";


    }catch(error){

        status.textContent =
            "❌ " +
            error.message;

    }

}


/*
   Open memory
*/

function openMemory(){

    if(!memoryId){

        return;
    }

    window.location.href =
        "/memory/" +
        encodeURIComponent(
            memoryId
        );

}

</script>

</body>
</html>
